name: Build iOS (IPA - unsigned)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install deps
        run: |
          npm install @capacitor/core@6.1.0 @capacitor/cli@6.1.0 @capacitor/ios@6.1.0 --save

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon*.png icon.svg www/ 2>/dev/null || true
          ls -la www/

      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios
          ls -la ios/

      - name: Select Xcode
        run: sudo xcode-select -p; xcodebuild -version

      - name: Build iOS (no signing - for simulator/test)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'generic/platform=iOS' -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -n 100
          # Try to create unsigned IPA
          mkdir -p Payload
          # Find .app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find . -name "App.app" -type d | head -n 1); fi
          echo "App found at: $APP_PATH"
          ls -la "$APP_PATH" || true

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios/
