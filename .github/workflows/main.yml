name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install deps
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon*.png icon.svg www/ 2>/dev/null || true
          ls -la www/
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync
          ls -la android/
          cat android/capacitor.settings.gradle || echo "settings missing - will fix"
          cat android/settings.gradle || true
      - name: Sync web assets
        run: npx cap copy
      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChekiTimer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
